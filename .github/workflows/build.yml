name: Compilar Mod Voidborn

on:
  push:
    branches:
      - "main"
      - "master"
  workflow_dispatch:


jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v4


      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'


      - name: Extrair projeto do ZIP
        run: |
          mkdir projeto

          unzip -o *.zip -d projeto

          echo "Procurando projeto Forge..."

          BUILD=$(find projeto -name "build.gradle" | head -n 1)

          if [ -z "$BUILD" ]; then
            echo "ERRO: build.gradle não encontrado"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD")

          echo "Projeto encontrado:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV


      - name: Preparar Gradle Wrapper
        run: |
          cd "$PROJECT_DIR"

          if [ ! -f "gradlew" ]; then
            echo "Gradle Wrapper não encontrado."

            echo "Baixando Gradle 8.8..."

            wget https://services.gradle.org/distributions/gradle-8.8-bin.zip

            unzip -q gradle-8.8-bin.zip

            echo "Criando Gradle Wrapper..."

            ./gradle-8.8/bin/gradle wrapper --gradle-version 8.8
          fi

          chmod +x gradlew


      - name: Compilar Mod
        run: |
          cd "$PROJECT_DIR"

          ./gradlew build -x test --no-daemon


      - name: Enviar JAR pronto
        uses: actions/upload-artifact@v4
        with:
          name: Voidborn-Mod-JAR
          path: "**/build/libs/*.jar"
