name: Compilar Mod Voidborn

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Descompactar o Mod
        run: |
          rm -rf Voidborn
          unzip -o *.zip
          if [ -d "Voidborn" ]; then
            cp -rn Voidborn/* . 2>/dev/null || true
          fi
          find . -name "gradlew" -exec chmod +x {} +

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compilar (.java para .class)
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew build
          else
            cd $(dirname $(find . -name "gradlew" | head -n 1))
            ./gradlew build
          fi

      - name: Enviar arquivo .jar pronto
        uses: actions/upload-artifact@v4
        with:
          name: Voidborn-Mod-JAR
          path: "**/build/libs/*.jar"
